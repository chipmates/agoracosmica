# Cloudflare Worker: the story archive. The live voice routes (speech,
# transcriptions, session end) answer 410: the speech server is retired.

name = "agora-cosmica-audio"
main = "src/index.ts"
compatibility_date = "2025-01-06"
workers_dev = false
preview_urls = false

# KV Namespace for the old health cache. Nothing reads it any more; it goes
# with the worker.
[[kv_namespaces]]
binding = "HEALTH_CACHE"
id = "d038eefec57840488a3e316037949b03"
preview_id = "ab898349850d40b9bd8f86ce08d79851"

# KV Namespace for rate limiting (separate from health — different TTLs, many keys)
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "276f721cc5ca4ff9aa3a8c01cda4494a"
preview_id = "e8ab36271a3046759a07bdc0a7a2dba2"

# R2 bucket holding the prerecorded story audio + transcripts
# (keys: stories/{figure}/{lang}/{figure}_{seed}_{lang}.{mp3,txt})
[[r2_buckets]]
binding = "STORY_BUCKET"
bucket_name = "agora-cosmica"

# Environment Variables
[vars]
ALLOWED_ORIGINS = "https://agoracosmica.org,https://www.agoracosmica.org"
# Both speech servers are retired. Nothing reads these; they stay empty.
SERVER_FSN1_URL = ""
SERVER_NBG1_URL = ""

# Secrets (set via wrangler secret put):
# - IP_HASH_SALT  (openssl rand -hex 32) — HMAC key for the archive quota's address
#                 hash. Set it before deploying; unset, the quota falls back to
#                 an unkeyed hash and logs one warning per isolate.
# No longer read: AUDIO_API_KEY, ORIGIN_VERIFY_KEY, LOAD_TEST_BYPASS_KEY.

# Routes
[[routes]]
pattern = "audio.agoracosmica.org/*"
zone_name = "agoracosmica.org"

[dev]
port = 8789
local_protocol = "http"

[build]
command = ""

# Analytics Engine for anonymous usage tracking (STATS-1/3)
# Zero PII: only language, model, server, status, latency. "Ohne Tracking" compliant.
# The 410s of the retired voice routes are counted here too (blob4 "410").
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "agora_audio"

[observability]
enabled = true

# Console logs stay; the per-request invocation log entries are not kept.
[observability.logs]
enabled = true
invocation_logs = false
