# Cloudflare Worker — Internal Analytics Dashboard (STATS-2)
# Serves HTML dashboard, queries Analytics Engine SQL API
# Protected by Cloudflare Access (configure in CF dashboard)

name = "agora-cosmica-stats"
main = "src/index.ts"
compatibility_date = "2025-01-06"
workers_dev = false
preview_urls = false

# Environment Variables
[vars]
SERVER_FSN1_URL = "https://fsn1.agoracosmica.org"
# NBG1 retired: the URL stays empty and unused, the panel shows FSN1 only (one server since Oct 2026).
SERVER_NBG1_URL = ""
# Unix epoch (seconds) of public launch. When > 0, every Analytics Engine query
# is floored at this timestamp and the sidebar shows "Stats since: <date>".
# Leave at "0" to disable (shows full AE history, no label).
# Set 2026-05-06 05:18:40 UTC — public launch.
LAUNCH_EPOCH_SECONDS = "1778044720"
# Museum of Ages panel: Cloudflare's own totals for the museum's zone.
# The day it opened (UTC), its languages (the root language first), and the
# walk's stops in their order, as the film's files name them.
MUSEUM_HOST = "museumofages.org"
MUSEUM_OPEN_DATE = "2026-10-06"
MUSEUM_LANGS = "en,de,fr,it,es,pt-BR,bg"
MUSEUM_WALK_STOPS = "picture-room,picture-room-lisa,picture-room-west,flight,works,reading-table,body,body-valve,line-early,supper-wall,arrival,courtyard,hall,oratory,study,chamber,grave"
# The Analytics Engine dataset the museum's own count writes to.
MUSEUM_COUNT_DATASET = "museum_count"

# Secrets (set via wrangler secret put):
# - MUSEUM_TREND_NOTES  (JSON with the trend charts' marks and aims; optional,
#                        never in this file)
# - MUSEUM_COUNT_ACCOUNT_ID, MUSEUM_COUNT_API_TOKEN (only if the museum's
#                        Pages project is in another account: that account's
#                        ID and a token with Account Analytics Read there)
# - MUSEUM_CF_API_TOKEN (read-only token for the museum's zone: Zone,
#                        Analytics, Read, that one zone and nothing else)
# - MUSEUM_ZONE_TAG     (the museum zone's ID; without both the panel says
#                        it is not set up and asks Cloudflare nothing)
# - CF_API_TOKEN       (API token with Analytics Engine read permission)
# - CF_ACCOUNT_ID      (Cloudflare account ID for Analytics Engine queries)
# - AUDIO_API_KEY      (Bearer token for the GEX130 server — same as audio worker)
# - ORIGIN_VERIFY_KEY  (X-Origin-Verify header — same value as audio worker;
#                       required once nginx on FSN1 enforces the check)

[[routes]]
pattern = "stats.agoracosmica.org/*"
zone_name = "agoracosmica.org"

[dev]
port = 8790
local_protocol = "http"

[build]
command = ""

[observability]
enabled = true

# Console logs stay; the per-request invocation log entries are not kept.
[observability.logs]
enabled = true
invocation_logs = false
