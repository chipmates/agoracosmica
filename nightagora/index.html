<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04060d" />
  <title>Agora Cosmica · Night Agora</title>
  <meta name="description" content="A living library you can talk to. Thirty remarkable people from history, kept as Echoes under one night sky." />
  <style>
    :root {
      --na-abyss: #04060d;
      --na-lapis: #0a1128;
      --na-horizon: #182350;
      --na-gold: #e0b96a;
      --na-gold-deep: #b8863b;
      --na-starlight: #f3efe2;
      --na-mist: #8d93ad;
      --serif: Georgia, 'Times New Roman', serif;
      --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: var(--na-abyss);
      color: var(--na-starlight);
      font-family: var(--serif);
      overflow: hidden;
    }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }

    #veil {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      text-align: center;
      padding: 0 24px calc(64px + env(safe-area-inset-bottom));
      pointer-events: none;
      z-index: 2;
    }
    .brand {
      position: fixed; top: calc(28px + env(safe-area-inset-top)); left: 0; right: 0;
      font-family: var(--sans);
      font-size: 11px; letter-spacing: 0.42em; text-indent: 0.42em;
      text-transform: uppercase; color: var(--na-mist);
    }
    h1 {
      font-weight: 400; font-size: clamp(26px, 4.2vw, 44px);
      letter-spacing: 0.02em; color: var(--na-starlight);
      text-wrap: balance;
    }
    .tagline {
      margin-top: 14px;
      font-family: var(--sans);
      font-size: 11px; letter-spacing: 0.34em; text-indent: 0.34em;
      text-transform: uppercase; color: var(--na-gold);
    }
    .status {
      margin-top: 42px;
      font-family: var(--sans);
      font-size: 10px; letter-spacing: 0.3em; text-indent: 0.3em;
      text-transform: uppercase; color: var(--na-mist);
      min-height: 14px;
      transition: opacity 1.2s ease;
    }
    body[data-phase='held'] .status { animation: breathe 3.4s ease-in-out infinite; animation-play-state: running; }
    @keyframes breathe { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.3; } }

    .copy { transition: opacity 1.6s ease; }
    body[data-phase='door'] .copy { opacity: 0; }
    body[data-phase='agora'] .copy { opacity: 0; }
    body[data-phase='sky'] .copy { opacity: 0; }
    body[data-phase='sky'] .status { opacity: 0.9; }

    #keeper {
      position: fixed; left: 0; right: 0;
      bottom: calc(120px + env(safe-area-inset-bottom));
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      pointer-events: none;
      transition: opacity 1.4s ease;
    }
    #keeper[hidden] { display: block; opacity: 0; visibility: hidden; }
    .keeper-name {
      font-family: var(--sans);
      font-size: 11px; letter-spacing: 0.3em; text-indent: 0.3em;
      text-transform: uppercase; color: var(--na-gold);
    }
    .keeper-line {
      margin-top: 12px;
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(17px, 2.4vw, 22px);
      color: var(--na-starlight);
      text-wrap: balance;
    }
    .keeper-note {
      margin-top: 12px;
      font-family: var(--sans);
      font-size: 9px; letter-spacing: 0.28em; text-indent: 0.28em;
      text-transform: uppercase; color: var(--na-mist);
    }

    /* ---- keeper · beat 5: the staged exchange ---- */
    #keeper { max-width: 680px; margin: 0 auto; }
    .keeper-dialogue { margin-top: 2px; pointer-events: auto; }
    .keeper-ask {
      margin-top: 12px;
      font-family: var(--serif); font-style: italic;
      font-size: clamp(15px, 2vw, 18px);
      color: var(--na-mist);
    }
    .keeper-phrase {
      margin-top: 12px;
      font-size: clamp(17px, 2.4vw, 22px);
      line-height: 1.55;
      color: var(--na-starlight);
      text-wrap: balance;
      text-shadow: 0 1px 16px rgba(4, 6, 13, 0.85);
      opacity: 0;
      transition: opacity 1.1s ease;
    }
    .keeper-phrase.lit { opacity: 1; }
    .keeper-phrase.out { opacity: 0; transition: opacity 0.9s ease; }
    .keeper-gold { color: var(--na-gold); }
    /* the breath window: the live exchange shows only the current breath,
       so the words never climb into the fire */
    .keeper-breath {
      position: relative;
      min-height: 4.4em;
      font-size: clamp(17px, 2.4vw, 22px);
    }
    .keeper-breath .keeper-phrase {
      position: absolute; left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      margin: 0; font-size: inherit;
    }
    .keeper-offers {
      margin-top: 18px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      opacity: 0; transition: opacity 1.4s ease;
      pointer-events: none;
    }
    .keeper-offer {
      background: none; border: none; cursor: pointer;
      font-family: var(--serif); font-style: italic;
      font-size: clamp(14px, 1.9vw, 16px);
      color: var(--na-mist); opacity: 0.62;
      min-height: 44px; padding: 0 12px;
      transition: opacity 0.5s ease, color 0.5s ease;
    }
    .keeper-offer:hover, .keeper-offer:focus-visible { opacity: 1; color: var(--na-starlight); }
    .keeper-form {
      margin: 10px auto 0; max-width: 440px;
      display: flex; align-items: center; gap: 14px;
      border-top: 1px solid color-mix(in srgb, var(--na-gold) 28%, transparent);
      padding-top: 4px;
      opacity: 0; transition: opacity 1.4s ease;
      pointer-events: none;
    }
    #keeper.open .keeper-offers, #keeper.open .keeper-form { opacity: 1; pointer-events: auto; }
    #keeper.answering .keeper-offers, #keeper.answering .keeper-form { opacity: 0; pointer-events: none; }
    .keeper-ask-label {
      font-family: var(--sans);
      font-size: 10px; letter-spacing: 0.32em; text-indent: 0.32em;
      text-transform: uppercase; color: var(--na-gold);
    }
    .keeper-input {
      flex: 1; min-width: 0; min-height: 44px;
      background: none; border: none; outline: none;
      font-family: var(--serif); font-style: italic;
      font-size: 16px; color: var(--na-starlight);
      caret-color: var(--na-gold);
    }
    #keeper .keeper-note { margin-top: 14px; }
    #keeper.instant *, #keeper.instant { transition: none !important; }

    /* on the postcard frame the letterpress band is shorter: tighten the
       exchange and let the coda carry the look-up hint */
    @media (max-width: 480px) {
      #keeper { bottom: calc(40px + env(safe-area-inset-bottom)); }
      .keeper-name { font-size: 9px; letter-spacing: 0.22em; text-indent: 0.22em; }
      .keeper-ask { margin-top: 10px; }
      .keeper-breath { min-height: 4.2em; font-size: 17px; }
      .keeper-offers { margin-top: 10px; }
      .keeper-form { margin-top: 4px; }
      #keeper .keeper-note { margin-top: 10px; }
      body[data-phase='agora'] .status { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      body[data-phase='held'] .status { animation: none; }
      .copy, .status { transition: none; }
      #keeper, #keeper * { transition: none; }
    }

    #atlas-card {
      position: fixed; z-index: 3;
      max-width: 280px;
      padding: 2px 0 2px 16px;
      border-left: 1px solid color-mix(in srgb, var(--na-gold) 55%, transparent);
      pointer-events: none;
      transition: opacity 0.3s ease;
      text-align: left;
    }
    #atlas-card[hidden] { display: block; opacity: 0; visibility: hidden; }
    .card-name {
      font-family: var(--sans);
      font-size: 12px; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--na-gold);
    }
    .card-years {
      margin-top: 4px;
      font-family: var(--sans);
      font-size: 10px; letter-spacing: 0.3em; color: var(--na-mist);
    }
    .card-epithet {
      margin-top: 8px;
      font-family: var(--serif);
      font-style: italic;
      font-size: 16px; line-height: 1.45; color: var(--na-starlight);
    }
  </style>
</head>
<body data-phase="transit">
  <div id="stage" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true" style="position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse 120% 90% at 50% 40%, transparent 52%, rgba(2, 3, 8, 0.62) 100%);"></div>
  <div id="veil">
    <p class="brand">Agora Cosmica</p>
    <div class="copy">
      <h1>A Living Library You Can Talk To</h1>
      <p class="tagline">Thirty Remarkable People · One Night Sky</p>
    </div>
    <p class="status" id="status" role="status">First light</p>
  </div>
  <div id="keeper" hidden>
    <p class="keeper-name">Marcus Aurelius · Keeper of Tonight's Fire</p>
    <p class="keeper-line">"I am not Marcus. I am an echo of what he left behind. Sit anyway."</p>
    <p class="keeper-note">An AI Echo · An interpretation, not a recording</p>
  </div>
  <div id="atlas-card" aria-live="polite" hidden>
    <p class="card-name"></p>
    <p class="card-years"></p>
    <p class="card-epithet"></p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
