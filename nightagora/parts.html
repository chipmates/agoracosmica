<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Parts kit</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #05070f;
        --paper: #e8e6df;
        --dim: #9aa0b0;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--ink); }
      body {
        font: 400 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--paper);
        overflow: hidden;
      }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

      .card {
        position: fixed;
        left: 24px;
        bottom: 24px;
        max-width: 52ch;
        padding: 14px 18px;
        border: 1px solid rgb(255 255 255 / 0.14);
        border-radius: 10px;
        background: rgb(5 7 15 / 0.72);
        backdrop-filter: blur(6px);
      }
      .card h1 {
        margin: 0 0 6px;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .card p { margin: 2px 0; color: var(--dim); font-size: 12.5px; }
      .card .says { color: var(--paper); }
      .card .fit {
        display: inline-block;
        margin-left: 8px;
        padding: 1px 8px;
        border: 1px solid rgb(255 255 255 / 0.2);
        border-radius: 999px;
        font-size: 11px;
        color: var(--dim);
        vertical-align: middle;
      }

      .index {
        position: fixed;
        left: 24px;
        top: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        max-width: 64ch;
        max-height: 44vh;
        overflow: auto;
      }
      .index a {
        padding: 4px 9px;
        border: 1px solid rgb(255 255 255 / 0.14);
        border-radius: 999px;
        color: var(--dim);
        text-decoration: none;
        font-size: 11.5px;
      }
      .index a[aria-current] { color: var(--ink); background: var(--paper); }
      body.forge .index { display: none; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <nav class="index" id="index" aria-label="the parts kit"></nav>
    <div class="card">
      <h1 id="name">the parts kit</h1>
      <p class="says" id="says"></p>
      <p id="numbers"></p>
      <p id="sets"></p>
    </div>
    <script type="module" src="/src/parts/main.ts"></script>
  </body>
</html>
