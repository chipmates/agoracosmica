name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you would like Agora Cosmica to do. If the idea is still open-ended, [Discussions](https://github.com/chipmates/agoracosmica/discussions) is the better room for it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to happen?
      placeholder: "It would be good if..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why does this matter? What does it make possible that is awkward today?
      placeholder: "Right now I have to... and that means..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Conversations (Wisdom, Quest, Free Talk)
        - Content (Story, Prism, Council)
        - Figures (new figures, corrections)
        - Audio (speech and transcription)
        - UI / Navigation
        - Accessibility
        - Translations / Localization
        - Security / Privacy
        - Self-hosting / Infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround you already use, or another shape this could take.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links, or anything else that helps explain the request.
    validations:
      required: false
