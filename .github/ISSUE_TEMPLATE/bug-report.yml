name: Bug report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The sections below are what we need to reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
      placeholder: "When I click X, I get Y. I expected Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Where were you?
      options:
        - Story
        - Wisdom
        - Prism
        - Quest
        - Free Talk
        - Council
        - Settings / Navigation
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Safari
        - Firefox
        - Edge
        - Samsung Internet
        - Other
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - Mobile (iOS)
        - Mobile (Android)
        - Tablet
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: How was chat set up?
      options:
        - Free tier (no API key)
        - Own OpenRouter key (BYOK)
        - Local Mode (a model you run)
        - Self-hosted instance
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If a picture shows the problem faster than a paragraph, add it here.
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open your browser's developer tools, check the Console tab, and paste anything red in here.
      render: shell
    validations:
      required: false
