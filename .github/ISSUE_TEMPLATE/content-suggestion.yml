name: Content suggestion
description: Suggest a figure, a council question, a factcheck correction, or another content change
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        The library holds 30 figures, each with twelve story chapters, twelve teachings, twelve prism dialogues and a factcheck, in English and German. Corrections and additions to any of that are welcome here.

  - type: dropdown
    id: type
    attributes:
      label: Type of suggestion
      options:
        - New figure
        - Historical correction (factcheck)
        - Council question
        - Story chapter improvement
        - Teaching or prism improvement
        - Translation correction
        - Other content
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the suggestion. For a correction, name the figure and the chapter or factcheck line it applies to.
      placeholder: "I noticed that... / It would be good to add..."
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: For a correction or a new figure, cite academic or otherwise authoritative sources. A correction with a source moves fast.
      placeholder: "According to [book, paper, or archive]..."
    validations:
      required: false

  - type: dropdown
    id: language
    attributes:
      label: Which language does this apply to?
      options:
        - English
        - German
        - Both
    validations:
      required: true
